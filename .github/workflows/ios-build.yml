name: iOS build

# Compiles the companion app for the Simulator, which needs no signing and no
# Apple account, so every push gets checked even when nobody has a Mac to hand.
# It does not run the app: the Simulator has no Bluetooth, so the BLE half can
# only be exercised on a real device.

on:
  push:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  pull_request:
    paths:
      - 'ios/**'
      - '.github/workflows/ios-build.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile for Simulator
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      # The project uses Xcode 16 synchronized folder groups, so a runner on an
      # older Xcode will fail to parse it. Printing this makes that obvious.
      - name: Toolchain
        run: |
          xcodebuild -version
          xcodebuild -list -project ios/EPaperNecklace/EPaperNecklace.xcodeproj

      # Telemetry.plist is gitignored, so a CI checkout has none and remote
      # logging stays off. Set the NTFY_TOPIC repository secret to have builds
      # from this workflow report to your topic instead.
      - name: Write telemetry config
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$NTFY_TOPIC" ]; then
            echo "NTFY_TOPIC secret not set - remote logging stays off."
            exit 0
          fi
          cat > ios/EPaperNecklace/EPaperNecklace/Telemetry.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>NtfyTopic</key>
              <string>${NTFY_TOPIC}</string>
          </dict>
          </plist>
          PLIST
          echo "Telemetry config written."

      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project ios/EPaperNecklace/EPaperNecklace.xcodeproj \
            -scheme EPaperNecklace \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee /tmp/build.log

      # Runs on success too: a green build with new warnings is worth seeing
      # without downloading the full log.
      - name: Diagnostics summary
        if: always()
        run: |
          echo "--- errors and warnings ---"
          grep -E '(error|warning):' /tmp/build.log \
            | grep -v 'AppIntents.framework' \
            | sort -u | head -60 || echo "(none)"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 7

  pipeline:
    name: Dithering self-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Guards the invariants the firmware depends on: 5,512 byte payload,
      # Classic never emits red, pack/unpack round trips, neutral greys stay
      # neutral. Standard library only, so no install step.
      - name: Run reference pipeline checks
        run: python3 ios/tools/verify_pipeline.py
